# Slice 7. The Render service definition.
#
# **This file carries no secret value.** `CARERELAY_API_TOKEN` is declared with
# `sync: false`, which means Render expects it to be set in the dashboard and
# will not read one from this repository. `tests/test_boundaries.py` fails if a
# token-shaped string ever appears here, so the guarantee is checked rather than
# promised.
#
# **Slice 7b: the record moved off this filesystem.** It now lives in Postgres on
# Supabase, reached through `APP_DATABASE_URL` below. That is what closes
# `04-slices.md` risk R8: a redeploy replaces the container filesystem, and a
# record that is not on it cannot be lost with it. The disk that used to be
# declared here was removed on 11 October 2026, at Slice 12, together with the
# paid instance type that existed only to hold it.

services:
  - type: web
    name: carerelay
    runtime: docker
    region: singapore

    # Slice 12, 11 October 2026: the disk block and `plan: starter` are gone.
    # Slice 7b moved the record to Postgres on Supabase, reached through
    # `APP_DATABASE_URL` below, so the 1 GB mount was dead weight and the paid
    # instance type existed only to hold it. With no disk the service runs on
    # the free tier, which spins down when idle: warm it before anyone opens
    # the live link. `tests/test_deployment.py` fails if a local database file
    # is named in this file again, which is the check that keeps the record off
    # an ephemeral filesystem.
    healthCheckPath: /health

    envVars:
      # Arms the bearer-token dependency. With this set and no token configured,
      # every `/api` route answers 503 rather than serving an open endpoint.
      - key: APP_ENV
        value: public

      # Postgres, on Supabase. Slice 7b. The value is a DSN and a DSN carries a
      # password, so it is set in the dashboard and not here: a DSN committed to
      # this repository is a credential leak, and `tests/test_deployment.py`
      # fails if one appears in this file. `src/carerelay/api.py` selects the
      # Postgres store from the `postgresql://` scheme, so no code change is
      # needed to move an environment between the two engines.
      - key: APP_DATABASE_URL
        sync: false

      # The Vercel origin of the Next.js frontend, and nothing else. A wildcard
      # is refused by `api._install_cors`, so this is the whole allow-list.
      - key: CORS_ORIGINS
        value: https://carerelay.vercel.app

      # The scenario clock keeps the demo's "6pm today" deadline stable instead
      # of drifting with the real date, so a judge sees the fixture as scripted.
      - key: APP_CLOCK
        value: scenario

      # The shared bearer token. No value here: set it in the dashboard.
      - key: CARERELAY_API_TOKEN
        sync: false
