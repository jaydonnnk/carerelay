[project]
name = "carerelay"
version = "0.1.0"
description = "CareRelay — patient-facing self-triage and care navigation. Research demonstration."
requires-python = ">=3.13"

# Runtime dependencies only. No install is implied beyond these declared names.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # Slice 7b. `src/carerelay/postgres_store.py` imports `psycopg` at module
    # scope, and `state.open_store` builds that store for any `postgresql://`
    # DSN, which is what `render.yaml` now supplies. It was never declared, so
    # the image the Dockerfile builds (`pip install .`) could not open a store
    # and the deployed service would have failed at construction with
    # `ModuleNotFoundError`. Every test stayed green because none of them builds
    # the image; `tests/test_deployment.py` now fails if an import in `src/` is
    # undeclared again.
    #
    # `[binary]` because the base image is `python:3.13-slim`, which has no
    # libpq and no compiler, and the Dockerfile deliberately has no build step.
    # The wheel bundles a prebuilt libpq, so the image stays as boring as its
    # own comment claims. `>=3.3` is the minor every Slice 7b test ran against
    # (3.3.6 locally), not a floor chosen from the changelog.
    "psycopg[binary]>=3.3",
]

# Slice 7. `jinja2` was declared from Slice 1 and imported nowhere, and the
# 30 September 2026 templates decision retired the server-rendered templates it
# was declared for. A declared dependency the code does not use is a claim the
# repository cannot support, so it is removed rather than left for the image to
# install.

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Slice 7. The patient fallback page links `/static/style.css` and the Slice 6
# review found it 404ing. Without this, `pip install .` puts the package in
# site-packages without its stylesheet, so the Docker image would 404 on the one
# static asset the service has.
[tool.setuptools.package-data]
"carerelay" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Domain purity is enforced by tests/test_boundaries.py, not by convention.
addopts = "-q"
