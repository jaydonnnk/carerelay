[project]
name = "carerelay"
version = "0.1.0"
description = "CareRelay — patient-facing self-triage and care navigation. Research demonstration."
requires-python = ">=3.13"

# Runtime dependencies only. No install is implied beyond these declared names.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Domain purity is enforced by tests/test_boundaries.py, not by convention.
addopts = "-q"
